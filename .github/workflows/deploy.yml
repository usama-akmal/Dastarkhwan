name: Deploy static content to Pages

# Only the default branch publishes.
#
# The `github-pages` environment has a custom branch policy that allows `master`
# alone, so a run from any other branch is rejected before its first step. That
# rejection is not harmless: it shares the `pages` concurrency group below, so it
# cancels the legitimate deploy from `master` and nothing ships. Restricting the
# trigger here means another branch cannot cancel the real deployment.
#
# To publish from `main` instead, add `main` to the environment's deployment branch
# policy in repository settings *and* to this list.
on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci

      # Re-run the gates here so a deploy can never ship something the verify
      # workflow would have rejected (e.g. a direct push that skipped PR checks).
      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
